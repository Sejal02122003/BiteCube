name: Git Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'

jobs:
  preflight:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run git security preflight
        shell: pwsh
        run: .\scripts\git-security-preflight.ps1

      - name: Validate PR branch readiness
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: .\scripts\git-pr-check.ps1 -BaseRef origin/${{ github.base_ref }} -ApproveProtectedChanges
